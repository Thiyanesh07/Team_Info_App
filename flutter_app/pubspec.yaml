name: team_info_app
description: "Team Management & Productivity Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  http: ^1.3.0
  web_socket_channel: ^3.0.2
  socket_io_client: ^3.0.2

  # Storage & Persistence
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # UI Components
  fl_chart: ^0.70.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.20.2
  timeago: ^3.7.0
  url_launcher: ^6.3.1
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.jpeg"
  min_sdk_android: 21 # android min sdk version

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_icon.jpeg
