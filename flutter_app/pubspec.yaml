name: team_info_app
description: "Team Management & Productivity Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  http: ^1.3.0
  web_socket_channel: ^3.0.2
  socket_io_client: ^3.0.2

  # Firebase
  firebase_core: ^3.10.1
  firebase_messaging: ^15.2.10

  # Storage & Persistence
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # UI Components
  fl_chart: ^1.2.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.20.2
  timeago: ^3.7.0
  url_launcher: ^6.3.1
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  flutter_animate: ^4.5.2
  excel: ^4.0.6
  pdf: ^3.12.0
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  open_filex: ^4.6.0
  connectivity_plus: ^7.0.0
  flutter_dotenv: ^6.0.0
  json_annotation: ^4.8.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  webview_flutter: ^4.13.1
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  build_runner: any
  json_serializable: any
  hive_generator: any

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/team_74_app_icon.jpeg"
  min_sdk_android: 21 # android min sdk version

flutter:
  uses-material-design: true
  assets:
    - assets/images/team_74_app_icon.jpeg
    - assets/images/app_icon.jpeg
    - assets/.env
